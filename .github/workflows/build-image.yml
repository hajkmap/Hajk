name: Build and publish image

# Builds a multi-platform image from a given branch or tag and pushes it to GHCR under the given tags. Called by the nightly-* and release workflows.
on:
  workflow_call:
    inputs:
      image:
        description: Package name under ghcr.io/hajkmap, for example hajk or hajk-simple
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root
        required: true
        type: string
      ref:
        description: Branch or tag to check out and build
        required: true
        type: string
      tags:
        description: Image tags to publish, as docker/metadata-action tag rules
        required: true
        type: string
      description:
        description: Value for the org.opencontainers.image.description label and annotation
        required: true
        type: string

env:
  IMAGE: ghcr.io/hajkmap/${{ inputs.image }}

jobs:
  # Each platform builds natively on its own runner and is pushed untagged, by digest only. The merge job then tags them together.
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scheduled runs always start from the default branch, so read the revision from the checked-out branch (context: git) for the OCI labels.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags }}
          labels: org.opencontainers.image.description=${{ inputs.description }}
          annotations: org.opencontainers.image.description=${{ inputs.description }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: GIT_HASH=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Tag multi-platform image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # GHCR reads the description of a multi-platform image from the index annotations, not from the platform images' labels.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          context: git
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags }}
          labels: org.opencontainers.image.description=${{ inputs.description }}
          annotations: org.opencontainers.image.description=${{ inputs.description }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && args+=(--annotation "$annotation")
          done <<< "$ANNOTATIONS"
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
