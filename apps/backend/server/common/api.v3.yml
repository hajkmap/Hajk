openapi: 3.0.3
info:
  title: Hajk Backend API
  description: The Hajk backend API specification is  the authoritative specification for the API to which all Hajk backend implementations must conform.
  version: 3.0.0
servers:
  - url: /api/v3
tags:
  - name: Client-accessible
    description: Resources necessary to load a working map in client
  - name: Admin only
    description: Resources that modify the database content and required an authorized user
  - name: Specification
    description: The OpenAPI specification
paths:
  /maps:
    get:
      tags:
        - Client-accessible
      responses:
        200:
          description: Return the list of maps
        500:
          description: Internal server error
    post:
      tags:
        - Admin only
      requestBody:
        description: Json with table data
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the map
                  example: my_map
                options:
                  $ref: "#/components/schemas/MapConfig"
                locked:
                  type: boolean
                  description: Lock the map
                  example: false
              required:
                - name
      responses:
        200:
          description: Return the list of maps
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /maps/{mapName}:
    get:
      tags:
        - Client-accessible
      parameters:
        - name: mapName
          in: path
          description: Name of the map to be fetched
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return the map config
        404:
          description: Requested map was not found
    patch:
      tags:
        - Admin only
      parameters:
        - name: mapName
          in: path
          description: Name of the map to be fetched
          required: true
          schema:
            type: string
      requestBody:
        description: Json with table data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapConfig"
      responses:
        200:
          description: Return the map config
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Admin only
      parameters:
        - name: mapName
          in: path
          description: Name of the map to be fetched
          required: true
          schema:
            type: string
      responses:
        204:
          description: Map deleted
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /maps/{mapName}/tools:
    get:
      tags:
        - Admin only
      parameters:
        - name: mapName
          in: path
          description: Name of the map
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return the tools configured for the map
        404:
          description: Map not found
    put:
      tags:
        - Admin only
      parameters:
        - name: mapName
          in: path
          description: Name of the map
          required: true
          schema:
            type: string
      requestBody:
        description: List of tools with placement and order
        content:
          application/json:
            schema:
              type: object
              properties:
                tools:
                  type: array
                  items:
                    type: object
                    properties:
                      toolId:
                        type: integer
                      index:
                        type: integer
                      target:
                        type: string
                        enum: [drawer, widgetLeft, widgetRight, controlButton]
                    required:
                      - toolId
                      - index
      responses:
        204:
          description: Map tools updated
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /maps/{mapName}/layers:
    get:
      tags:
        - Admin only
      parameters:
        - name: mapName
          in: path
          description: Name of the map
          required: true
          schema:
            type: string
      responses:
        200:
          description: Layers on the map (direct placements and via groups)
        404:
          description: Map not found
    put:
      tags:
        - Admin only
      parameters:
        - name: mapName
          in: path
          description: Name of the map
          required: true
          schema:
            type: string
      requestBody:
        description: Layers placed directly on the map (replaces existing set)
        content:
          application/json:
            schema:
              type: object
              properties:
                layers:
                  type: array
                  items:
                    type: object
                    properties:
                      layerId:
                        type: string
                      usage:
                        type: string
                        enum: [BACKGROUND, FOREGROUND]
                      visibleAtStart:
                        type: boolean
                      infoClickActive:
                        type: boolean
                      zIndex:
                        type: integer
                    required:
                      - layerId
      responses:
        204:
          description: Map layers updated
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Map not found
  /maps/{mapName}/groups:
    put:
      tags:
        - Admin only
      parameters:
        - name: mapName
          in: path
          description: Name of the map
          required: true
          schema:
            type: string
      requestBody:
        description: Group placements on the map (replaces existing set)
        content:
          application/json:
            schema:
              type: object
              properties:
                groups:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      groupId:
                        type: string
                      parentGroupId:
                        type: string
                        nullable: true
                      usage:
                        type: string
                        enum: [BACKGROUND, FOREGROUND]
                      name:
                        type: string
                      toggled:
                        type: boolean
                      expanded:
                        type: boolean
                    required:
                      - groupId
      responses:
        204:
          description: Map groups updated
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Map not found
  /layers:
    get:
      tags:
        - Client-accessible
      responses:
        200:
          description: Return the list of layers
        500:
          description: Internal server error
  /groups:
    get:
      tags:
        - Client-accessible
      responses:
        200:
          description: Return the list of groups
        500:
          description: Internal server error
  /groups/{groupId}:
    get:
      tags:
        - Client-accessible
      parameters:
        - name: groupId
          in: path
          description: ID of the group to be fetched
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return the group
        404:
          description: Requested group was not found
  /groups/{groupId}/maps:
    get:
      tags:
        - Client-accessible
      parameters:
        - name: groupId
          in: path
          description: ID of the group to be fetched
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return the maps that use the group
        404:
          description: Requested group was not found
  /groups/{groupId}/layers:
    get:
      tags:
        - Client-accessible
      parameters:
        - name: groupId
          in: path
          description: ID of the group to be fetched
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return the layers that belong to the group
        404:
          description: Requested group was not found
  /services:
    get:
      tags:
        - Admin only
      responses:
        200:
          description: Return the list of services
        500:
          description: Internal server error
    post:
      tags:
        - Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Service created
        400:
          description: Invalid request body
  /services/projections:
    get:
      tags:
        - Admin only
      responses:
        200:
          description: Return the list of projections
  /services/{id}:
    get:
      tags:
        - Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return the service
        404:
          description: Service not found
    patch:
      tags:
        - Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Service updated
        404:
          description: Service not found
    delete:
      tags:
        - Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Service deleted
        404:
          description: Service not found
  /services/{id}/layers/count:
    get:
      tags:
        - Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return layer counts linked to this service
  /services/{id}/layers:
    get:
      tags:
        - Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return summary fields for layers linked to this service
  /services/{id}/maps:
    get:
      tags:
        - Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return the maps affected by this service
  /services/{id}/groups:
    get:
      tags:
        - Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return the groups affected by this service
  /services/{id}/health-status:
    patch:
      tags:
        - Admin only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        204:
          description: Health status updated
  /tools:
    get:
      tags:
        - Client-accessible
      responses:
        200:
          description: Return the list of tools (soft-deleted tools are excluded)
        500:
          description: Internal server error
    post:
      tags:
        - Admin only
      requestBody:
        description: New tool instance
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Plugin type, must exist in ToolType
                  example: infoclick
                title:
                  type: string
                  description: Instance name
                  example: Infoklick standard
                options:
                  type: object
              required:
                - type
      responses:
        201:
          description: Tool created
        400:
          description: Invalid request (e.g. unknown tool type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tools/types:
    get:
      tags:
        - Admin only
      responses:
        200:
          description: Return the list of available tool types
  /tools/{id}:
    patch:
      tags:
        - Admin only
      parameters:
        - name: id
          in: path
          description: ID of the tool instance
          required: true
          schema:
            type: integer
      requestBody:
        description: Fields to update
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                title:
                  type: string
                options:
                  type: object
      responses:
        200:
          description: Tool updated
    delete:
      tags:
        - Admin only
      description: Soft delete — the tool is hidden but kept in the database with its map placements
      parameters:
        - name: id
          in: path
          description: ID of the tool instance
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Tool deleted (soft)
  /tools/{toolName}/maps:
    get:
      tags:
        - Client-accessible
      parameters:
        - name: toolName
          in: path
          description: Name of the tool to be fetched
          required: true
          schema:
            type: string
      responses:
        200:
          description: Return the maps that use the tool
        404:
          description: Requested tool was not found
  /maps/{mapName}/documenthandler/folders:
    get:
      tags:
        - Admin only
      summary: List document folders for a map
      parameters:
        - name: mapName
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  folders:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentFolder"
        404:
          description: Map not found
    post:
      tags:
        - Admin only
      summary: Create a new document folder
      parameters:
        - name: mapName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
              required:
                - title
      responses:
        201:
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFolder"
        400:
          description: Validation error
  /maps/{mapName}/documenthandler/folders/{folder}:
    put:
      tags:
        - Admin only
      summary: Rename a document folder (title only; slug name is immutable)
      parameters:
        - name: mapName
          in: path
          required: true
          schema:
            type: string
        - name: folder
          in: path
          description: Folder slug (URL-safe name)
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
              required:
                - title
      responses:
        200:
          description: Folder renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFolder"
        404:
          description: Folder not found
    delete:
      tags:
        - Admin only
      summary: Delete a document folder (blocked if it contains documents)
      parameters:
        - name: mapName
          in: path
          required: true
          schema:
            type: string
        - name: folder
          in: path
          description: Folder slug (URL-safe name)
          required: true
          schema:
            type: string
      responses:
        204:
          description: Folder deleted
        404:
          description: Folder not found
        409:
          description: Folder still contains documents
  /maps/{mapName}/documenthandler/folders/{folder}/documents:
    get:
      tags:
        - Admin only
      summary: List documents in a folder
      parameters:
        - name: mapName
          in: path
          required: true
          schema:
            type: string
        - name: folder
          in: path
          description: Folder slug
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of documents (metadata only, no content)
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentSummary"
        404:
          description: Map or folder not found
    post:
      tags:
        - Admin only
      summary: Create a new document
      parameters:
        - name: mapName
          in: path
          required: true
          schema:
            type: string
        - name: folder
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
              required:
                - title
      responses:
        201:
          description: Document created with empty chapter tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        400:
          description: Validation error
        404:
          description: Map or folder not found
  /maps/{mapName}/documenthandler/folders/{folder}/documents/{name}:
    get:
      tags:
        - Admin only
      summary: Load a document with its full content
      parameters:
        - name: mapName
          in: path
          required: true
          schema:
            type: string
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: Document slug (URL-safe name)
          required: true
          schema:
            type: string
      responses:
        200:
          description: Full document including content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        404:
          description: Document not found
    put:
      tags:
        - Admin only
      summary: Save (full replace) document content and optional title
      parameters:
        - name: mapName
          in: path
          required: true
          schema:
            type: string
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: object
                  description: Chapter tree JSON
              required:
                - content
      responses:
        200:
          description: Document saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        400:
          description: Validation error
        404:
          description: Document not found
    delete:
      tags:
        - Admin only
      summary: Delete a document
      parameters:
        - name: mapName
          in: path
          required: true
          schema:
            type: string
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Document deleted
        404:
          description: Document not found
  /search/autocomplete:
    post:
      tags:
        - Client-accessible
      description: Fuzzy search (for autocomplete)
      responses:
        200:
          description: List of results
          content: {}
      parameters:
        - in: header
          name: X-Control-Header
          description: User name that will be supplied to AD
          schema:
            type: string
          required: false
      requestBody:
        description: Json with table data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchAutocompleteBody"
  /websockets:
    get:
      tags:
        - Client-accessible
      description: WebSocket upgrade endpoint for real-time communication
      summary: WebSocket Connection
      responses:
        101:
          description: Switching Protocols - WebSocket connection established
          headers:
            Upgrade:
              schema:
                type: string
                example: "websocket"
            Connection:
              schema:
                type: string
                example: "Upgrade"
            Sec-WebSocket-Accept:
              schema:
                type: string
                example: "s3pPLMBiTxaQ9kYGzzhZRbK+xOo="
        400:
          description: Bad Request - Invalid WebSocket upgrade request
        426:
          description: Upgrade Required - Request must be upgraded to WebSocket
      parameters:
        - in: header
          name: Upgrade
          description: Must be "websocket" for WebSocket upgrade
          required: true
          schema:
            type: string
            enum: ["websocket"]
        - in: header
          name: Connection
          description: Must be "Upgrade" for WebSocket upgrade
          required: true
          schema:
            type: string
            enum: ["Upgrade"]
        - in: header
          name: Sec-WebSocket-Key
          description: WebSocket key for handshake
          required: true
          schema:
            type: string
        - in: header
          name: Sec-WebSocket-Version
          description: WebSocket version
          required: true
          schema:
            type: string
            enum: ["13"]
  /websockets/health:
    get:
      tags:
        - Client-accessible
      description: Get WebSocket server health status and statistics
      summary: WebSocket Health Check
      responses:
        200:
          description: WebSocket health information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSocketHealth"
        503:
          description: Service Unavailable - WebSocket server is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSocketHealthError"
components:
  schemas:
    SearchAutocompleteBody:
      type: object
      properties:
        queryString:
          type: string
          description: "The string to search for"
          example: "stoora"
        pgTrgmSimilarityThreshold:
          type: number
          format: float
          description: "Threshold for pg_trgm similarity"
          example: 0.2
        limitPerSource:
          type: integer
          description: "Limit per source"
          example: 5
        totalLimit:
          type: integer
          description: "Total limit"
          example: 20
        sources:
          type: array
          items:
            type: object
            properties:
              table:
                type: string
                description: "Table name"
                example: "adresspunkter"
              column:
                type: string
                description: "Column name"
                example: "fastighet"
          example:
            - table: "adresspunkter"
              column: "fastighet"
            - table: "adresspunkter"
              column: "kommundel"
            - table: "adresspunkter"
              column: "beladress"
      required:
        - pgTrgmSimilarityThreshold
        - limitPerSource
        - totalLimit
        - sources
    WebSocketHealth:
      type: object
      properties:
        status:
          type: string
          description: "WebSocket server status"
          example: "WebSocket server is running"
        timestamp:
          type: string
          format: date-time
          description: "ISO timestamp of the health check"
          example: "2024-01-15T10:30:00.000Z"
        clients:
          type: integer
          description: "Number of connected WebSocket clients"
          example: 5
        uptime:
          type: number
          format: float
          description: "Server uptime in seconds"
          example: 3600.5
        memoryUsage:
          type: object
          description: "Node.js memory usage statistics"
          properties:
            rss:
              type: integer
              description: "Resident Set Size"
              example: 45678912
            heapTotal:
              type: integer
              description: "Total heap size"
              example: 20971520
            heapUsed:
              type: integer
              description: "Used heap size"
              example: 12345678
            external:
              type: integer
              description: "External memory usage"
              example: 1234567
            arrayBuffers:
              type: integer
              description: "Array buffer memory usage"
              example: 987654
        cpuUsage:
          type: object
          description: "Node.js CPU usage statistics"
          properties:
            user:
              type: integer
              description: "User CPU time in microseconds"
              example: 1234567
            system:
              type: integer
              description: "System CPU time in microseconds"
              example: 987654
        platform:
          type: string
          description: "Operating system platform"
          example: "linux"
        arch:
          type: string
          description: "CPU architecture"
          example: "x64"
        version:
          type: string
          description: "Node.js version"
          example: "v18.17.0"
        networkUsage:
          type: object
          description: "Network usage statistics (Node.js 18.6.0+)"
          nullable: true
          properties:
            bytesRead:
              type: integer
              description: "Bytes read from network"
            bytesWritten:
              type: integer
              description: "Bytes written to network"
        diskUsage:
          type: object
          description: "Disk usage statistics (Node.js 18.6.0+)"
          nullable: true
          properties:
            bytesRead:
              type: integer
              description: "Bytes read from disk"
            bytesWritten:
              type: integer
              description: "Bytes written to disk"
      required:
        - status
        - timestamp
        - clients
        - uptime
        - memoryUsage
        - cpuUsage
        - platform
        - arch
        - version
    WebSocketHealthError:
      type: object
      properties:
        status:
          type: string
          description: "Error status message"
          example: "WebSocket server is not enabled"
        timestamp:
          type: string
          format: date-time
          description: "ISO timestamp of the error"
          example: "2024-01-15T10:30:00.000Z"
        error:
          type: string
          description: "Error description"
          example: "WebSocket server is not running or not configured"
      required:
        - status
        - timestamp
        - error
    DocumentFolder:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: "URL-safe slug (immutable after creation)"
        title:
          type: string
          description: "Human-readable display name"
        mapName:
          type: string
        createdBy:
          type: string
          nullable: true
        createdDate:
          type: string
          format: date-time
          nullable: true
        lastSavedBy:
          type: string
          nullable: true
        lastSavedDate:
          type: string
          format: date-time
          nullable: true
        _count:
          type: object
          properties:
            documents:
              type: integer
          description: "Number of documents in the folder (included on list responses)"
      required:
        - id
        - name
        - title
        - mapName
    DocumentSummary:
      type: object
      description: "Document metadata without content"
      properties:
        id:
          type: integer
        name:
          type: string
          description: "URL-safe slug (immutable after creation)"
        title:
          type: string
        createdDate:
          type: string
          format: date-time
          nullable: true
        lastSavedDate:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - title
    Document:
      type: object
      description: "Full document including chapter tree content"
      properties:
        id:
          type: integer
        name:
          type: string
          description: "URL-safe slug (immutable after creation)"
        title:
          type: string
        content:
          type: object
          description: "Chapter tree JSON: { chapters: [...] }"
        mapName:
          type: string
        folderId:
          type: integer
        createdBy:
          type: string
          nullable: true
        createdDate:
          type: string
          format: date-time
          nullable: true
        lastSavedBy:
          type: string
          nullable: true
        lastSavedDate:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - title
        - content
        - mapName
        - folderId
    Error:
      type: object
      properties:
        error:
          type: string
          description: "Error message"
          example: "Invalid request"
        code:
          type: string
          description: "Error code"
          example: "INVALID_REQUEST"
        details:
          type: string
          description: "Additional error details"
          example: "The provided map configuration is invalid"
      required:
        - error
    MapConfig:
      type: object
      description: "Map configuration object"
      properties:
        id:
          type: string
          description: "Unique identifier for the map"
          example: "map-123"
        name:
          type: string
          description: "Display name of the map"
          example: "My Map"
        description:
          type: string
          description: "Description of the map"
          example: "A sample map configuration"
        layers:
          type: array
          description: "Array of layer configurations"
          items:
            type: object
            properties:
              id:
                type: string
                description: "Layer identifier"
              name:
                type: string
                description: "Layer name"
              type:
                type: string
                description: "Layer type"
              visible:
                type: boolean
                description: "Whether the layer is visible"
              opacity:
                type: number
                format: float
                description: "Layer opacity (0-1)"
        tools:
          type: array
          description: "Array of tool configurations"
          items:
            type: object
            properties:
              id:
                type: string
                description: "Tool identifier"
              name:
                type: string
                description: "Tool name"
              type:
                type: string
                description: "Tool type"
              enabled:
                type: boolean
                description: "Whether the tool is enabled"
        view:
          type: object
          description: "Map view configuration"
          properties:
            center:
              type: array
              items:
                type: number
              description: "Map center coordinates [longitude, latitude]"
              example: [18.0686, 59.3293]
            zoom:
              type: number
              format: float
              description: "Map zoom level"
              example: 10.5
            projection:
              type: string
              description: "Map projection"
              example: "EPSG:3857"
      required:
        - name
