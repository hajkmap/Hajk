    <div id="lbl"></div>
    <script>
      let s = 1;
      const max = 4,
        groups = document.querySelectorAll(".st"),
        lbl = document.getElementById("lbl");
      function render() {
        groups.forEach((g) => g.classList.toggle("hide", +g.dataset.step > s));
        lbl.textContent = s + " / " + max;
      }
      function go(d) {
        s = Math.min(max, Math.max(1, s + d));
        render();
      }
      document.addEventListener("keydown", (e) => {
        if (
          ["ArrowRight", "ArrowDown", " ", "PageDown", "Enter"].includes(e.key)
        ) {
          e.preventDefault();
          go(1);
        }
        if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) {
          e.preventDefault();
          go(-1);
        }
        if (e.key === "f") {
          document.fullscreenElement
            ? document.exitFullscreen()
            : document.documentElement.requestFullscreen();
        }
      });
      document.addEventListener("click", () => go(1));
      render();
    </script>
