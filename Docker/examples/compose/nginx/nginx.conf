# EXAMPLE ONLY. In production, this is where you would add TLS (HTTPS).
#
# Every request must have a session from oauth2-proxy. nginx asks oauth2-proxy
# with a subrequest to /oauth2/auth (auth_request) and passes the user name,
# email and groups it gets back on to Hajk and GeoServer in headers.

# njs, for converting the groups to GeoServer's format.
load_module modules/ngx_http_js_module.so;

worker_processes auto;

# nginx runs as a non-root user, which cannot write to the default /run/nginx.pid.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;
  access_log   /var/log/nginx/access.log;

  js_import geoserver from /etc/nginx/geoserver-roles.js;
  js_set    $geoserver_roles geoserver.roles;

  server {
    listen 8080;

    server_tokens off;
    client_max_body_size 20m;

    # The session cookie and the Keycloak redirects can make large headers.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # Look up the containers through Docker's DNS on every request, instead
    # of once at startup, so nginx finds a container again after it is
    # recreated. This only works when proxy_pass is given a variable.
    resolver 127.0.0.11 valid=10s;
    set $oauth2_proxy http://oauth2-proxy:4180;
    set $geoserver    http://geoserver:8080;
    set $hajk         http://hajk:3002;

    # Login, callback from Keycloak and logout.
    location /oauth2/ {
      proxy_pass       $oauth2_proxy;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Where to send the user back to after logging in.
      proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # The subrequest from auth_request. Replies 202 with the user in
    # headers, or 401 if there is no valid session.
    location = /oauth2/auth {
      internal;
      proxy_pass       $oauth2_proxy;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Content-Length "";
      proxy_pass_request_body off;
    }

    # Logs out of both oauth2-proxy and Keycloak, then back to Hajk.
    location = /logout {
      return 302 /oauth2/sign_out?rd=http%3A%2F%2Flocalhost%3A8180%2Frealms%2Fhajk%2Fprotocol%2Fopenid-connect%2Flogout%3Fclient_id%3Dhajk%26post_logout_redirect_uri%3Dhttp%253A%252F%252Flocalhost%253A8080%252F;
    }

    location /geoserver/ {
      auth_request /oauth2/auth;
      # Not logged in: oauth2-proxy redirects the browser to Keycloak.
      error_page 401 = /oauth2/sign_in;
      # Keeps the session cookie fresh when oauth2-proxy refreshes it.
      auth_request_set $auth_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_cookie;

      auth_request_set $hajk_user   $upstream_http_x_auth_request_preferred_username;
      auth_request_set $hajk_groups $upstream_http_x_auth_request_groups;

      proxy_pass         $geoserver;
      # GeoServer builds its own URLs, and checks for CSRF, from these.
      proxy_set_header   Host $http_host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      # Read by the hajk-header filter in GeoServer, see
      # geoserver/configure-security.sh. Roles are separated by ";".
      proxy_set_header   X-GeoServer-User $hajk_user;
      proxy_set_header   X-GeoServer-Roles $geoserver_roles;
    }

    location / {
      auth_request /oauth2/auth;
      error_page 401 = /oauth2/sign_in;
      auth_request_set $auth_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_cookie;

      auth_request_set $hajk_user   $upstream_http_x_auth_request_preferred_username;
      auth_request_set $hajk_email  $upstream_http_x_auth_request_email;
      # Separated by ",", which is what Hajk expects.
      auth_request_set $hajk_groups $upstream_http_x_auth_request_groups;

      proxy_pass         $hajk;
      proxy_redirect     off;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host $host;
      # Always set, so a browser can never send its own values to Hajk.
      proxy_set_header   X-Control-Header $hajk_user;
      proxy_set_header   X-Control-Email-Header $hajk_email;
      proxy_set_header   X-Control-Group-Header $hajk_groups;
    }
  }
}
